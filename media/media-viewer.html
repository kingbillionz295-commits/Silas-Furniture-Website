<!-- ========================================= -->
<!-- UNIVERSAL MEDIA ENGINE V5 -->
<!-- ========================================= -->

<div id="media-viewer" class="media-viewer hidden">

    <!-- Background -->

    <div id="viewer-backdrop" class="viewer-backdrop"></div>

    <!-- Main Container -->

    <div class="viewer-shell">

        <!-- Close -->

        <button id="close-viewer" class="viewer-close">

            <span class="material-symbols-outlined">
                close
            </span>

        </button>

        <!-- Loading -->

        <div id="viewer-loader" class="viewer-loader">

            <div class="loader-ring"></div>

        </div>

        <!-- IMAGE -->

        <div id="image-container" class="image-container">

            <img
                id="viewer-image"
                class="viewer-image"
                draggable="false"
                hidden>

        </div>

        <!-- VIDEO -->

        <div id="video-container" class="video-container" hidden>

            <video

                id="viewer-video"

                class="viewer-video"

                playsinline

                preload="metadata">

            </video>

            <!-- Play -->

            <button id="play-button" class="play-button">

                <span class="material-symbols-outlined">

                    play_circle

                </span>

            </button>

            <!-- Fullscreen -->

            <button id="fullscreen-btn"

                class="fullscreen-btn">

                <span class="material-symbols-outlined">

                    fullscreen

                </span>

            </button>

        </div>

    </div>

</div>
