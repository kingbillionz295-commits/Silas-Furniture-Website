<!-- ========================================================= -->
<!-- SILAS FURNITURE -->
<!-- UNIVERSAL MEDIA VIEWER V6 -->
<!-- CORE COMPONENT -->
<!-- ========================================================= -->


<div id="media-viewer" class="media-viewer hidden">


    <!-- =============================== -->
    <!-- DARK BACKDROP -->
    <!-- =============================== -->

    <div 
        id="viewer-backdrop"
        class="viewer-backdrop">
    </div>



    <!-- =============================== -->
    <!-- VIEWER WINDOW -->
    <!-- =============================== -->

    <div class="viewer-window">


        <!-- CLOSE BUTTON -->

        <button
            id="viewer-close"
            class="viewer-close">

            ✕

        </button>



        <!-- =============================== -->
        <!-- IMAGE AREA -->
        <!--"" =============================== -->

        <div 
            id="image-stage"
            class="image-stage hidden">


            <img
                id="viewer-image"
                class="viewer-image"
                draggable="false"
                alt="Furniture preview">


        </div>




        <!-- =============================== -->
        <!-- VIDEO AREA -->
        <!-- =============================== -->

        <div
            id="video-stage"
            class="video-stage hidden">


            <video
                id="viewer-video"
                class="viewer-video"
                playsinline
                preload="metadata">

            </video>



            <!-- PLAY BUTTON -->

            <button
                id="video-play-btn"
                class="video-play-btn">

                ▶

            </button>




            <!-- VIDEO CONTROLS -->

            <div
                id="video-controls"
                class="video-controls">


                <input
                    id="video-progress"
                    class="video-progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0">



                <button
                    id="video-fullscreen-btn"
                    class="video-fullscreen-btn">

                    ⛶

                </button>


            </div>



            <!-- SPEED / SEEK OVERLAY -->

            <div
                id="video-gesture-layer"
                class="video-gesture-layer">


                <div
                    id="seek-left"
                    class="seek-zone left">
                </div>



                <div
                    id="seek-right"
                    class="seek-zone right">
                </div>


            </div>



        </div>



        <!-- LOADING -->

        <div
            id="viewer-loader"
            class="viewer-loader">


            <div class="spinner"></div>


        </div>



    </div>



</div>
<div id="viewer-toast" class="viewer-toast"></div>
